name: Release (Windows + Linux to itch)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and Vite
        shell: pwsh
        run: |
          npm run build:quick

      - name: Create Windows zip
        shell: pwsh
        run: |
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          $sourcePath = "release\$version\win-unpacked\*"
          $zipPath = "release\College-Basketball-Dynasty-$version-Windows.zip"
          Compress-Archive -Path $sourcePath -DestinationPath $zipPath -Force

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            release/*-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run build:linux
        env:
          DEBUG: electron-builder

      - name: List build output
        if: always()
        run: |
          echo "Contents of release directory:"
          ls -laR release/ || echo "No release directory found"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/**/*.tar.gz

  publish-itch:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "Error: BUTLER_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$ITCH_TARGET" ]; then
            echo "Error: ITCH_TARGET secret is not set"
            exit 1
          fi
          echo "Secrets are configured"
          echo "ITCH_TARGET: $ITCH_TARGET"

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist-release/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist-release/linux

      - name: Install Butler CLI
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Authenticate Butler
        run: |
          ./butler login
          ./butler status

      - name: Publish to itch (Windows)
        run: |
          ls -la dist-release/windows
          WIN_FILE=$(ls dist-release/windows/*-Windows.zip | head -n 1)
          echo "Uploading: $WIN_FILE to $ITCH_TARGET:windows"
          ./butler push "$WIN_FILE" "$ITCH_TARGET:windows" --userversion-file dist-release/windows/version.txt || ./butler push "$WIN_FILE" "$ITCH_TARGET:windows"

      - name: Publish to itch (Linux)
        run: |
          ls -la dist-release/linux
          LINUX_FILE=$(ls dist-release/linux/*.tar.gz | head -n 1)
          echo "Uploading: $LINUX_FILE to $ITCH_TARGET:linux"
          ./butler push "$LINUX_FILE" "$ITCH_TARGET:linux" --userversion-file dist-release/linux/version.txt || ./butler push "$LINUX_FILE" "$ITCH_TARGET:linux"
