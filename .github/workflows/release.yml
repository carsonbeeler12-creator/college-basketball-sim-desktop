name: Release (Windows + Linux to itch)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and Vite
        shell: pwsh
        run: |
          npm run build:quick

      - name: Create Windows zip
        shell: pwsh
        run: |
          $packageJson = Get-Content "package.json" | ConvertFrom-Json
          $version = $packageJson.version
          $sourcePath = "release\$version\win-unpacked\*"
          $zipPath = "release\College-Basketball-Dynasty-$version-Windows.zip"
          Compress-Archive -Path $sourcePath -DestinationPath $zipPath -Force

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            release/*-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run build:linux

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/**/*.AppImage

  publish-itch:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
    steps:
      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist-release/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist-release/linux

      - name: Install Butler CLI
        run: |
          curl -L -o butler.tar.gz https://broth.itch.zone/butler/linux-amd64/head/archive/default
          mkdir -p $HOME/bin
          tar -xzf butler.tar.gz -C $HOME/bin
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Publish to itch (Windows)
        run: |
          ls -la dist-release/windows
          butler push "$(ls dist-release/windows/*-Windows.zip | head -n 1)" "$ITCH_TARGET:windows"

      - name: Publish to itch (Linux)
        run: |
          ls -la dist-release/linux
          butler push "$(ls dist-release/linux/*.AppImage | head -n 1)" "$ITCH_TARGET:linux"
