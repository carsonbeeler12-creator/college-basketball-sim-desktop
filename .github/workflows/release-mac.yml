name: Release (macOS to itch)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MAC_CERTS }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REQUIRE_MAC_NOTARIZATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate mac signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build macOS DMG
        run: |
          npm run build:mac -- --publish never

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/darwin-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          sudo mv butler /usr/local/bin/

      - name: Push macOS build to itch
        shell: bash
        run: |
          if [ -z "$ITCH_TARGET" ]; then
            echo "Skipping itch.io push: ITCH_TARGET is not set."
            exit 0
          fi
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "Skipping itch.io push: BUTLER_API_KEY is not set."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          DMG_PATH=$(ls -1 release/${VERSION}/*.dmg 2>/dev/null | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            DMG_PATH=$(ls -1 release/${VERSION}/*.zip 2>/dev/null | head -n 1)
          fi
          if [ -z "$DMG_PATH" ]; then
            echo "No macOS .dmg or .zip found in release/${VERSION}"
            exit 1
          fi
          butler push "$DMG_PATH" "$ITCH_TARGET:mac" --userversion="$VERSION"
